[package]
name = "something_bg_core"
version.workspace = true
edition = "2024"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.20"
croner = "3.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
humantime_fmt = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
